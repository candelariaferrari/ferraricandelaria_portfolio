# Configuración de deploy en Netlify
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: cualquier ruta (por ej. /proyectos/nomapay) la resuelve React Router.
# Sin esto, entrar directo o recargar una ruta interna da 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
